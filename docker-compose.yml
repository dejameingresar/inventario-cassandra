services:
  cassandra:
    image: cassandra:5
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=lab
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_DC=datacenter1
    depends_on:
      cassandra:
        condition: service_healthy
