name: deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-image"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::Sin RENDER_DEPLOY_HOOK configurado; se omite el despliegue."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"
